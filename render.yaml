# Render blueprint for the API. The frontend is deployed separately (Vercel / Netlify).
services:
  - type: web
    name: duolingo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"   # tighten to your Vercel URL after deploying
      - key: PYTHON_VERSION
        value: "3.12.3"
